<svg viewBox="0 0 800 960" width="800" height="960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#f8f9fa" />
      <stop offset="45%" stopColor="#e9ecef" />
      <stop offset="85%" stopColor="#ced4da" />
      <stop offset="100%" stopColor="#adb5bd" />
    </radialGradient>
    <linearGradient id="suit-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="40%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>
    <linearGradient id="suit-lapel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#334155" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="shirt-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#dbeafe" />
      <stop offset="50%" stopColor="#bfdbfe" />
      <stop offset="100%" stopColor="#93c5fd" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f3c299" />
      <stop offset="35%" stopColor="#e5a777" />
      <stop offset="80%" stopColor="#cb8858" />
      <stop offset="100%" stopColor="#b26f43" />
    </linearGradient>
    <linearGradient id="skin-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#fde0c2" />
      <stop offset="100%" stopColor="#e5a777" />
    </linearGradient>
    <linearGradient id="desk-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#5c3826" />
      <stop offset="10%" stopColor="#432617" />
      <stop offset="50%" stopColor="#301a0e" />
      <stop offset="100%" stopColor="#1d0f07" />
    </linearGradient>
    <linearGradient id="laptop-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#cbd5e1" />
      <stop offset="50%" stopColor="#94a3b8" />
      <stop offset="100%" stopColor="#64748b" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" floodOpacity="0.3" />
    </filter>
  </defs>

  <!-- Office Background -->
  <rect width="800" height="960" fill="url(#bg-glow)" />

  <!-- Modern Office Shelving (Right) -->
  <g transform="translate(620, 60)" opacity="0.9">
    <rect x="0" y="0" width="160" height="700" fill="#1e293b" rx="6" />
    <!-- Shelf Dividers -->
    <rect x="0" y="160" width="160" height="8" fill="#334155" />
    <rect x="0" y="340" width="160" height="8" fill="#334155" />
    <rect x="0" y="520" width="160" height="8" fill="#334155" />
    <!-- Books on Shelf 1 -->
    <rect x="15" y="40" width="22" height="120" fill="#991b1b" rx="3" />
    <rect x="42" y="30" width="18" height="130" fill="#1e40af" rx="3" />
    <rect x="65" y="50" width="26" height="110" fill="#b45309" rx="3" />
    <rect x="96" y="35" width="20" height="125" fill="#065f46" rx="3" />
    <!-- Award Frame on Shelf 2 -->
    <rect x="25" y="200" width="110" height="120" fill="#f8fafc" stroke="#d97706" stroke-width="6" rx="4" />
    <circle cx="80" cy="250" r="16" fill="#d97706" opacity="0.3" />
    <rect x="45" y="280" width="70" height="6" fill="#64748b" rx="2" />
    <rect x="55" y="295" width="50" height="4" fill="#94a3b8" rx="2" />
    <!-- Plant on Shelf 3 -->
    <rect x="50" y="460" width="60" height="60" fill="#ffffff" rx="8" />
    <ellipse cx="80" cy="430" rx="35" ry="30" fill="#15803d" />
    <ellipse cx="65" cy="405" rx="20" ry="25" fill="#22c55e" transform="rotate(-15, 65, 405)" />
    <ellipse cx="95" cy="405" rx="20" ry="25" fill="#16a34a" transform="rotate(15, 95, 405)" />
  </g>

  <!-- Large Office Plant (Left) -->
  <g transform="translate(10, 240)">
    <path d="M70,360 Q20,280 10,180 Q50,220 70,360 Z" fill="#166534" />
    <path d="M70,360 Q0,240 5,100 Q40,160 70,360 Z" fill="#15803d" />
    <path d="M70,360 Q60,180 80,60 Q95,160 70,360 Z" fill="#22c55e" />
    <path d="M70,360 Q110,210 130,120 Q120,220 70,360 Z" fill="#16a34a" />
    <path d="M70,360 Q130,270 150,200 Q125,270 70,360 Z" fill="#15803d" />
  </g>

  <!-- Wall CareerBuddies Signage -->
  <g transform="translate(120, 85)" filter="url(#soft-shadow)">
    <!-- Logo Symbol -->
    <g transform="translate(60, 0) scale(1.1)">
      <!-- Stepping Buddies Logo Icon -->
      <path d="M45,28 L35,42 L42,42 L38,55 L58,36 L48,36 Z" fill="#006e29" />
      <circle cx="38" cy="22" r="5.5" fill="#002869" />
      <circle cx="55" cy="14" r="5.5" fill="#006e29" />
    </g>
    <text x="135" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="#002869">Career</text>
    <text x="250" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="#006e29">Buddies</text>
    <text x="75" y="68" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#002869" letter-spacing="2.5">YOUR CAREER  |  🤝  |  OUR GUIDANCE</text>
    <!-- FOUNDER Badge -->
    <rect x="110" y="80" width="180" height="34" rx="8" fill="#002869" />
    <text x="200" y="103" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="19" fill="#ffffff" text-anchor="middle" letter-spacing="4">FOUNDER</text>
  </g>

  <!-- Person: Nishant Sharma (Founder) -->
  <g id="person-nishant" filter="url(#soft-shadow)">
    <!-- Body / Suit Torso & Shoulders -->
    <path d="M160,960 L205,580 Q280,530 400,530 Q520,530 595,580 L640,960 Z" fill="url(#suit-navy)" />
    
    <!-- Light Blue Dress Shirt -->
    <path d="M330,545 L400,760 L470,545 Q400,565 330,545 Z" fill="url(#shirt-blue)" />
    <!-- Shirt Collar (V-neck open collar) -->
    <path d="M330,545 L370,630 L400,570 L360,525 Z" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <path d="M470,545 L430,630 L400,570 L440,525 Z" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />

    <!-- Suit Lapels -->
    <path d="M260,565 L370,810 L400,810 L310,555 Z" fill="url(#suit-lapel)" />
    <path d="M540,565 L430,810 L400,810 L490,555 Z" fill="url(#suit-lapel)" />

    <!-- Neck -->
    <rect x="365" y="445" width="70" height="105" rx="16" fill="url(#skin)" />
    <!-- Neck Shadow -->
    <path d="M365,490 Q400,530 435,490 L435,530 L365,530 Z" fill="#9a5a32" opacity="0.3" />

    <!-- Head / Face -->
    <ellipse cx="400" cy="360" rx="90" ry="106" fill="url(#skin)" />
    <!-- Cheek Highlight -->
    <ellipse cx="370" cy="355" rx="35" ry="40" fill="url(#skin-highlight)" opacity="0.4" />
    <ellipse cx="430" cy="355" rx="35" ry="40" fill="url(#skin-highlight)" opacity="0.4" />

    <!-- Full Groomed Beard and Mustache -->
    <path d="M315,360 Q310,465 400,474 Q490,465 485,360 Q475,438 400,446 Q325,438 315,360 Z" fill="#0f172a" />
    <!-- Mustache -->
    <path d="M352,398 Q400,386 448,398 Q400,422 352,398 Z" fill="#0f172a" />

    <!-- Mouth / Smile -->
    <path d="M375,414 Q400,428 425,414" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Nose -->
    <path d="M396,340 L390,378 L410,378" stroke="#8c4f2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Eyes & Brows -->
    <!-- Left Brow & Eye -->
    <path d="M342,308 Q368,298 386,310" stroke="#0f172a" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <ellipse cx="364" cy="328" rx="10" ry="7.5" fill="#1e293b" />
    <circle cx="368" cy="326" r="3" fill="#ffffff" />
    <!-- Right Brow & Eye -->
    <path d="M414,310 Q432,298 458,308" stroke="#0f172a" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <ellipse cx="436" cy="328" rx="10" ry="7.5" fill="#1e293b" />
    <circle cx="440" cy="326" r="3" fill="#ffffff" />

    <!-- Styled Dark Hair -->
    <path d="M308,335 Q298,245 360,230 Q410,220 460,234 Q502,250 492,335 Q478,265 400,260 Q322,265 308,335 Z" fill="#090d16" />
    <path d="M350,240 Q390,215 440,230 Q410,218 370,228 Z" fill="#1e293b" />

    <!-- Clasped Hands on Desk -->
    <g transform="translate(400, 825)">
      <ellipse cx="0" cy="0" rx="75" ry="38" fill="url(#skin)" />
      <path d="M-50,0 Q0,20 50,0" stroke="#8c4f2b" stroke-width="3" fill="none" />
      <path d="M-30,-8 Q0,10 30,-8" stroke="#8c4f2b" stroke-width="3" fill="none" />
    </g>
  </g>

  <!-- Executive Wooden Desk -->
  <rect x="0" y="805" width="800" height="155" fill="url(#desk-wood)" />
  <rect x="0" y="805" width="800" height="8" fill="#78472f" />

  <!-- Left: Black Coffee Mug with CareerBuddies Logo -->
  <g transform="translate(70, 755)">
    <rect x="0" y="0" width="56" height="66" rx="6" fill="#090d16" />
    <!-- Mug Handle -->
    <path d="M-4,15 Q-20,33 -4,51" stroke="#090d16" stroke-width="7" fill="none" />
    <!-- Mini CB Logo on Mug -->
    <text x="28" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#006e29" text-anchor="middle">CB</text>
    <text x="28" y="52" font-family="sans-serif" font-weight="700" font-size="7" fill="#38bdf8" text-anchor="middle">CareerBuddies</text>
  </g>

  <!-- Right: Modern Open Laptop -->
  <g transform="translate(550, 700)" opacity="0.95">
    <!-- Laptop Screen -->
    <polygon points="20,0 180,0 170,120 10,120" fill="url(#laptop-metal)" stroke="#475569" stroke-width="2" />
    <rect x="25" y="10" width="140" height="98" fill="#0f172a" rx="2" />
    <circle cx="95" cy="55" r="9" fill="#ffffff" opacity="0.8" />
    <!-- Laptop Base -->
    <polygon points="0,120 185,120 215,150 -15,150" fill="#64748b" />
  </g>
</svg>
